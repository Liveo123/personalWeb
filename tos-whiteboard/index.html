<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOS Whiteboard</title>
<link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/Liveo123/personalWeb/master/tos-v5/favicon.svg?v=1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}.bar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:7px;align-items:center;padding:7px 9px;background:rgba(15,23,42,.94);border:1px solid #334155;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18)}button,a,label{border:1px solid #475569;background:#1e293b;color:#fff;padding:7px 10px;border-radius:8px;font:inherit;font-size:13px;text-decoration:none;cursor:pointer}button:hover,a:hover,label:hover{background:#334155}.active{background:#0ea5e9;border-color:#0ea5e9;color:#04131d;font-weight:700}.danger{background:#4c1d1d;border-color:#7f1d1d}.swatch{width:32px;height:32px;padding:0;border-radius:8px;background:#fff}.range{display:flex;align-items:center;gap:6px;color:#cbd5e1;font-size:12px;padding:0 4px}.range input{width:85px}.hint{position:fixed;bottom:10px;left:12px;color:#64748b;font-size:11px;z-index:4;user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}@media(max-width:720px){.bar{left:8px;right:8px;transform:none;overflow-x:auto;justify-content:flex-start}.bar>*{flex:none}.hint{display:none}}
</style>
</head>
<body>
<div class="bar">
  <a href="https://htmlpreview.github.io/?https://github.com/Liveo123/personalWeb/blob/master/tos-v5/index.html">TOS Home</a>
  <button id="pen" class="active">Pen</button>
  <button id="eraser">Eraser</button>
  <input id="colour" class="swatch" type="color" value="#111827" title="Pen colour">
  <div class="range"><span>Size</span><input id="size" type="range" min="1" max="30" value="4"></div>
  <button id="undo">Undo</button>
  <button id="clear" class="danger">Clear</button>
  <button id="save">Save PNG</button>
</div>
<canvas id="board"></canvas>
<div class="hint">Drag to draw. Works with mouse, touch or stylus.</div>
<script>
const c=document.getElementById('board'),x=c.getContext('2d');let drawing=false,mode='pen',history=[];const pen=document.getElementById('pen'),eraser=document.getElementById('eraser'),colour=document.getElementById('colour'),size=document.getElementById('size');
function resize(){const snapshot=c.width&&c.height?c.toDataURL():null;const dpr=Math.max(1,window.devicePixelRatio||1);c.width=Math.floor(innerWidth*dpr);c.height=Math.floor(innerHeight*dpr);c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(dpr,0,0,dpr,0,0);x.fillStyle='#fff';x.fillRect(0,0,innerWidth,innerHeight);if(snapshot){const im=new Image();im.onload=()=>x.drawImage(im,0,0,innerWidth,innerHeight);im.src=snapshot}}
function snap(){if(history.length>20)history.shift();history.push(c.toDataURL())}
function pos(e){const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}
function start(e){e.preventDefault();snap();drawing=true;const p=pos(e);x.beginPath();x.moveTo(p.x,p.y)}
function move(e){if(!drawing)return;e.preventDefault();const p=pos(e);x.lineCap='round';x.lineJoin='round';x.lineWidth=Number(size.value);x.strokeStyle=mode==='eraser'?'#fff':colour.value;x.lineTo(p.x,p.y);x.stroke()}
function stop(){drawing=false;x.closePath()}
function select(m){mode=m;pen.classList.toggle('active',m==='pen');eraser.classList.toggle('active',m==='eraser')}
pen.onclick=()=>select('pen');eraser.onclick=()=>select('eraser');
document.getElementById('clear').onclick=()=>{snap();x.fillStyle='#fff';x.fillRect(0,0,innerWidth,innerHeight)};
document.getElementById('undo').onclick=()=>{const src=history.pop();if(!src)return;const im=new Image();im.onload=()=>{x.fillStyle='#fff';x.fillRect(0,0,innerWidth,innerHeight);x.drawImage(im,0,0,innerWidth,innerHeight)};im.src=src};
document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='TOS-Whiteboard.png';a.href=c.toDataURL('image/png');a.click()};
c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);window.addEventListener('pointerup',stop);window.addEventListener('resize',resize);resize();
</script>
</body>
</html>
